  <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY} from './config.js';
  
  const TABLE_NAME = "apartment_deals";
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // const hostElement = document.querySelector('#supabase-host');
  // const shadowRoot = hostElement.attachShadow({mode: 'closed'});
  const sidebarDrawer = document.getElementById('sidebar-drawer');
  const sidebarOverlay = document.getElementById('sidebar-overlay');
  const sidebarTrigger = document.getElementById('sidebar-trigger-zone');
  const sidebarCloseBtn = document.getElementById('sidebar-close-btn');

  function openSidebar() {
    if (sidebarDrawer) sidebarDrawer.classList.add('is-active');
    if (sidebarOverlay) sidebarOverlay.classList.add('is-active');
  }

  function closeSidebar() {
    if (sidebarDrawer) sidebarDrawer.classList.remove('is-active');
    if (sidebarOverlay) sidebarOverlay.classList.remove('is-active');
  }

  document.addEventListener('mousemove', (e) => {
    if (e.clientX <= 25) {
      openSidebar();
    }
  });

  if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
  if (sidebarCloseBtn) sidebarCloseBtn.addEventListener('click', closeSidebar);

  document.getElementById('region-select').addEventListener('change',fetchApartmentDeals);
  document.getElementById('year-select').addEventListener('change',fetchApartmentDeals);
  document.getElementById('search-input').addEventListener('change',handleSearch)

  // 페이지 로드시 데이터 조회화면 렌더링
  document.addEventListener('DOMContentLoaded', () => {
    fetchApartmentDeals();
  })

  // -------------------------------------------------------------
  // 데이터 불러오기 (선택된 지역코드 & 연도 조건 적용)
  // -------------------------------------------------------------
  let processedData = [];
  async function fetchApartmentDeals() {
    // const { data, error } = await supabaseClient.from(TABLE_NAME).select('*').order('id', {ascending: true});
    const loadingState = document.getElementById('loading-state');
    const dealsTable = document.getElementById('deals-table');
    const errorContainer = document.getElementById('error-container');

    const selectedResion = document.getElementById('region-select').value;
    const selectedYear = document.getElementById('year-select').value;

    loadingState.style.display = 'flex';
    errorContainer.style.display = 'none';
    dealsTable.style.display = 'none';

    let query = supabaseClient.from(TABLE_NAME).select('*');

    if (selectedResion) {
      query = query.eq('sggCd', selectedResion);
    }

    if (selectedYear && selectedYear !== 'ALL') {
      query = query.eq('dealYear', parseInt(selectedYear,10));
    }


    const {data, error} = await query.order('id', {ascending: true})

    if (error) {
      console.error('데이터 조회 실패', error.message);
      return;
    }
    
    processedData = data.map(item => {
      let amountNum = 0;
      if (item.dealAmount) {
        amountNum = parseInt(String(item.dealAmount).replace(/,/g,'').trim(), 10) || 0;
      }

      const year = item.dealYear || '';
      const month = String(item.dealMonth || '').padStart(2, '0');
      const day = String(item.dealDay || '').padStart(2, '0');
      const dealDateStr = year ? `${year}-${month}-${day}` : '';

      return {
        ...item,
        dealAmountVal: amountNum,
        dealDateStr: dealDateStr
      }
    })

    // 테이블 렌더링
    renderTable(processedData);

    loadingState.style.display = 'none';
    dealsTable.style.display = 'table';
  }

  // 금액 포맷 (예: 185000 -> 18억 5,000만)
  function formatKoreanPrice(amount) {
    if (!amount) return '-';
    const uk = Math.floor(amount/10000);
    const man = amount%10000;

    let res = '';
    if (uk > 0) res += `${uk}억`;
    if (man > 0) res += `${man.toLocaleString()}만`;
    return res.trim() + '원';
  }

  // -------------------------------------------------------------
  // 테이블 렌더링
  // -------------------------------------------------------------
  function renderTable(dataList) {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    if (dataList.length === 0){
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 40px;">선택한 조건의 데이터없음</td></tr>`;
      console.log("데이터없음")
      return;
    }

    dataList.forEach(item => {
      const tr = document.createElement('tr');

      const aptName = item.aptNm || '미지정';
      const umd = item.umdNm ? item.umdNm.trim() :'';
      const jibun = item.jibun ? item.jibun.trim() :'';
      const location = `${umd} ${jibun}`.trim() || '-';
      const formattedPrice = formatKoreanPrice(item.dealAmountVal) || item.dealAmount || '-';
      const areaPyeong = item.excluUseAr ? `${item.excluUseAr}㎡ (${Math.round(item.excluUseAr / 3.3)}평)` : '-';
      const floorStr = item.floor ? `${item.floor}층` : '-';
      const buildYearStr = item.buildYear ? `${item.buildYear}년` : '-';

      tr.innerHTML = `
        <td>${item.id}</td>
        <td class="apt-name">${aptName}</td>
        <td>${location}</td>
        <td class="price-tag">${formattedPrice}</td>
        <td>${item.dealDateStr || '-'}</td>
        <td><span class="area-tag">${areaPyeong}</span></td>
        <td><span class="floor-tag">${floorStr}</span></td>
        <td>${buildYearStr}</td>
      `

      tbody.appendChild(tr);
    })
  }

  // -------------------------------------------------------------
  // 검색어 필터링 및 정렬 통합 처리
  // -------------------------------------------------------------
  function handleSearch() {
    const keyword = document.getElementById('search-input').value.trim();

    let filtered = processedData.filter(item => {
      if (!keyword) return true;
      const name = (item.aptNm || '');
      const umd = (item.umdNm || '');
      const jibun = (item.jibun || '');
      return name.includes(keyword) || umd.includes(keyword) || jibun.includes(keyword);
    });

    renderTable(filtered);
  }
  </script>
