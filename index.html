<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find벤치</title>
  <style>
    @font-face {
        font-family: 'GMarketSans';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
        font-weight: 500;
        font-display: swap;
    }
    :root {
      --bg: #f8fafc;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --panel-border: rgba(203, 213, 225, 0.9);
      --card-bg: #ffffff;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --table-th-bg: #f1f5f9;
      --table-td-border: #e2e8f0;
      --table-td-text: #334155;
      --row-hover: rgba(255, 255, 255, 0.03);
      --primary: #059669;
      --primary-glow: rgba(62, 207, 142, 0.2);
      --primary-green: #10b981;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-blue: #38bdf8;
      --text: #0f172a;
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family: 'GMarketSans';
      min-height: 100vh;
      background-image: 
    radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.06) 0px, transparent 50%);
    }

    /* Header */
    header {
      height: 64px;
      background: rgba(11,15,25,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-weight: 800;
      font-size: 1.15rem;
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      background: var(--primary-green);
      border-radius: 8px;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      list-style: none;
      gap: 20px;
    }

    .nav-menu a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .nav-item.active a, .nav-item a:hover {
      color: var(--text-main);
      background: rgba(255,255,255,0.06);
    }

    .nav-right {
      display: flex;
      gap: 14px;
    }

    .preset-pill{
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: var(--primary-green);
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 20px;
    }

    .preset-dot {
      width: 6px;
      height: 6px;
      background: var(--primary-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--primary-green);
    }

    .btn-share {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      padding: 6px 18px;
      border-radius: 8px;
      font-size: 0.825rem;
      cursor: pointer;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-share:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    main {
      max-width: 1280px;
      margin: 28px auto 0;
      padding: 0 24px;
    }

    /* Control panel */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      justify-content: space-between;
    }

    .filters-group {
      display: flex;
      gap: 12px;
      flex: 1;
    }

    .select-box {
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      min-width: 160px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .select-box:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 200px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 42px;
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-refresh {
      background: var(--primary);
      color: var(--card-bg);
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      gap: 8px;
      transition: background 0.15s ease;
    }

    /* Table container*/
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: none;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: var(--table-th-bg);
      padding: 14px 18px;
      letter-spacing: 0.05em;
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--panel-border);
    }
    
    th:hover {
      color: var(--text);
    }

    td {
      padding: 14px 18px;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--table-td-border);
      color: var(--table-td-text);
    }

    tr:hover td {
      background-color: var(--row-hover);
    }

    .apt-name {
      font-weight: 600;
      color: var(--text);
    }

    .price-tag {
      font-weight: 700;      
      color: var(--primary);
      font-size: 1rem;
    }

    .area-tag {
      background: rgba(56,189,248,0.1);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .floor-tag {
      background: rgba(148,163,184,0.15);
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }




  </style>
</head>

  <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  // import { SUPABASE_URL, SUPABASE_ANON_KEY} from './config.js';
  
  export async function onRequest(context) {
    const SUPABASE_URL = context.env.SUPABASE_URL
    const SUPABASE_ANON_KEY = context.env.SUPABASE_ANON_KEY

    console.log(SUPABASE_URL)
  }
  
  
  const TABLE_NAME = "apartment_deals";
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // const hostElement = document.querySelector('#supabase-host');
  // const shadowRoot = hostElement.attachShadow({mode: 'closed'});

  document.getElementById('region-select').addEventListener('change',fetchApartmentDeals);
  document.getElementById('year-select').addEventListener('change',fetchApartmentDeals);
  document.getElementById('search-input').addEventListener('change',handleSearch)

  // 페이지 로드시 데이터 조회화면 렌더링
  document.addEventListener('DOMContentLoaded', () => {
    fetchApartmentDeals();
  })

  // -------------------------------------------------------------
  // 데이터 불러오기 (선택된 지역코드 & 연도 조건 적용)
  // -------------------------------------------------------------
  let processedData = [];
  async function fetchApartmentDeals() {
    // const { data, error } = await supabaseClient.from(TABLE_NAME).select('*').order('id', {ascending: true});
    const loadingState = document.getElementById('loading-state');
    const dealsTable = document.getElementById('deals-table');
    const errorContainer = document.getElementById('error-container');

    const selectedResion = document.getElementById('region-select').value;
    const selectedYear = document.getElementById('year-select').value;

    loadingState.style.display = 'flex';
    errorContainer.style.display = 'none';
    dealsTable.style.display = 'none';

    let query = supabaseClient.from(TABLE_NAME).select('*');

    if (selectedResion) {
      query = query.eq('sggCd', selectedResion);
    }

    if (selectedYear && selectedYear !== 'ALL') {
      query = query.eq('dealYear', parseInt(selectedYear,10));
    }


    const {data, error} = await query.order('id', {ascending: true})

    if (error) {
      console.error('데이터 조회 실패', error.message);
      return;
    }
    // console.log("데이터", data);
    
    processedData = data.map(item => {
      let amountNum = 0;
      if (item.dealAmount) {
        amountNum = parseInt(String(item.dealAmount).replace(/,/g,'').trim(), 10) || 0;
      }

      const year = item.dealYear || '';
      const month = String(item.dealMonth || '').padStart(2, '0');
      const day = String(item.dealDay || '').padStart(2, '0');
      const dealDateStr = year ? `${year}-${month}-${day}` : '';

      return {
        ...item,
        dealAmountVal: amountNum,
        dealDateStr: dealDateStr
      }
    })

    // 테이블 렌더링
    renderTable(processedData);

    loadingState.style.display = 'none';
    dealsTable.style.display = 'table';
  }

  // 금액 포맷 (예: 185000 -> 18억 5,000만)
  function formatKoreanPrice(amount) {
    if (!amount) return '-';
    const uk = Math.floor(amount/10000);
    const man = amount%10000;

    let res = '';
    if (uk > 0) res += `${uk}억`;
    if (man > 0) res += `${man.toLocaleString()}만`;
    return res.trim() + '원';
  }

  // -------------------------------------------------------------
  // 테이블 렌더링
  // -------------------------------------------------------------
  function renderTable(dataList) {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    if (dataList.length === 0){
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 40px;">선택한 조건의 데이터없음</td></tr>`;
      console.log("데이터없음")
      return;
    }

    dataList.forEach(item => {
      const tr = document.createElement('tr');

      const aptName = item.aptNm || '미지정';
      const umd = item.umdNm ? item.umdNm.trim() :'';
      const jibun = item.jibun ? item.jibun.trim() :'';
      const location = `${umd} ${jibun}`.trim() || '-';
      const formattedPrice = formatKoreanPrice(item.dealAmountVal) || item.dealAmount || '-';
      const areaPyeong = item.excluUseAr ? `${item.excluUseAr}㎡ (${Math.round(item.excluUseAr / 3.3)}평)` : '-';
      const floorStr = item.floor ? `${item.floor}층` : '-';
      const buildYearStr = item.buildYear ? `${item.buildYear}년` : '-';

      tr.innerHTML = `
        <td>${item.id}</td>
        <td class="apt-name">${aptName}</td>
        <td>${location}</td>
        <td class="price-tag">${formattedPrice}</td>
        <td>${item.dealDateStr || '-'}</td>
        <td><span class="area-tag">${areaPyeong}</span></td>
        <td><span class="floor-tag">${floorStr}</span></td>
        <td>${buildYearStr}</td>
      `

      tbody.appendChild(tr);
    })
  }

  // -------------------------------------------------------------
  // 검색어 필터링 및 정렬 통합 처리
  // -------------------------------------------------------------
  function handleSearch() {
    const keyword = document.getElementById('search-input').value.trim();

    let filtered = processedData.filter(item => {
      if (!keyword) return true;
      const name = (item.aptNm || '');
      const umd = (item.umdNm || '');
      const jibun = (item.jibun || '');
      return name.includes(keyword) || umd.includes(keyword) || jibun.includes(keyword);
    });

    renderTable(filtered);
  }
  </script>
</body>
